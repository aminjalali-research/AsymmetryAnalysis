[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asymmetry-analysis"
version = "0.1.0"
description = "ASL perfusion EZ lateralization toolkit (voxel-based zAI + ROI-based MDT discrimination) for drug-resistant focal epilepsy"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Amin Jalali", email = "amin@thememorialcollective.com"},
]
requires-python = ">=3.10"
keywords = [
    "neuroimaging",
    "ASL",
    "arterial-spin-labeling",
    "epilepsy",
    "epileptogenic-zone",
    "lateralization",
    "MRI",
    "FreeSurfer",
    "perfusion",
    "asymmetry",
    "z-score",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "nibabel>=5.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "scikit-learn>=1.3",
    "openpyxl>=3.1",
    "plotly>=5.0",
    "statsmodels>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[project.urls]
"Homepage" = "https://github.com/<TODO-org>/AsymmetryAnalysis"
"Bug Tracker" = "https://github.com/<TODO-org>/AsymmetryAnalysis/issues"

[tool.setuptools]
packages = ["src"]

[tool.setuptools.package-data]
src = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
